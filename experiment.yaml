kiosk_mode:
  non_admin_settings:
    kiosk: true
    ignore_entity_settings: true
  entity_settings:
    - entity:
        input_boolean.kiosk_mode: 'on'
      hide_header: true
      hide_sidebar: true
    - entity:
        input_boolean.kiosk_mode: 'off'
      hide_header: false
      hide_sidebar: false
views:
  - title: Home-New
    path: home-new
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: 'Today: {{ states(''sensor.afvalwijzer_today'')|capitalize }}'
            secondary: ''
            icon: |-
              {% if is_state('sensor.afvalwijzer_today', 'gft') %}
                mdi:food-apple
              {% elif is_state('sensor.afvalwijzer_today', 'papier') %}
                mdi:newspaper-variant-multiple-outline
              {% elif is_state('sensor.afvalwijzer_today', 'restafval') %}
                mdi:delete
              {% elif is_state('sensor.afvalwijzer_today', 'pd') %}
                mdi:delete
              {% else %}
                mdi:delete-empty
              {% endif %}
            entity: sensor.afvalwijzer_today
            tap_action:
              action: none
            picture: >-
              {% if is_state('sensor.afvalwijzer_today', 'gft') %}
                /local/afvalwijzer/gft.png
              {% elif is_state('sensor.afvalwijzer_today', 'papier') %}
                /local/afvalwijzer/papier.png
              {% elif is_state('sensor.afvalwijzer_today', 'restafval') %}
                /local/afvalwijzer/restafval.png
              {% elif is_state('sensor.afvalwijzer_today', 'pd') %}
                /local/afvalwijzer/plastic.png
              {% elif is_state('sensor.afvalwijzer_today', 'kerstbomen,
              restafval') %}
                /local/afvalwijzer/restafval.png
              {% else %}
                /local/afvalwijzer/kliko.png
              {% endif %}
            double_tap_action:
              action: perform-action
              perform_action: input_boolean.turn_on
              data: {}
              target:
                entity_id: input_boolean.thrash_collected
            layout_options:
              grid_columns: full
              grid_rows: 1
            visibility:
              - condition: state
                entity: sensor.afvalwijzer_today
                state_not: Geen
              - condition: state
                entity: input_boolean.thrash_collected
                state: 'off'
            color: |-
              {% if is_state('sensor.afvalwijzer_today', 'gft') %}
                green
              {% elif is_state('sensor.afvalwijzer_today', 'papier') %}
                blue
              {% elif is_state('sensor.afvalwijzer_today', 'restafval') %}
                grey
              {% elif is_state('sensor.afvalwijzer_today', 'pd') %}
                orange
              {% else %}
                grey
              {% endif %}
            features_position: bottom
          - type: custom:mushroom-template-card
            primary: '{{ states(''sensor.anniversary_text'') }}'
            secondary: ''
            icon: mdi:party-popper
            grid_options:
              columns: full
            visibility:
              - condition: state
                entity: sensor.anniversary_day
                state: 'True'
            color: yellow
            features_position: bottom
            card_mod:
              style: |
                ha-state-icon {
                  {{ 'animation: bounce 1s linear infinite;' }}
                }
                @keyframes bounce {
                  0%, 10%, 50%, 80%, 100% {transform: translateY(0); } 
                  40% { transform: translateY(-1.2px) rotate(5deg); } 
                  60% { transform: translateY(-1.1px) rotate(-4deg); } 
                }
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Music
                icon: mdi:radio
                tap_action:
                  action: navigate
                  navigation_path: sonos
                layout_options:
                  grid_columns: 1
                  grid_rows: 2
                color: blue
                vertical: true
                features_position: bottom
              - type: custom:mushroom-template-card
                primary: Lights
                icon: mdi:lightbulb-on
                layout: vertical
                icon_color: amber
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-tablet/lights
                layout_options:
                  grid_columns: 1
                  grid_rows: 2
                card_mod:
                  style: |
                    ha-state-icon {
                      {{ 'animation: illumination 2s infinite;' }}
                    }
                    @keyframes illumination {
                      80% { clip-path: polygon(0% 99%, 20% 55%, 22% 37%, 39% 20%, 61% 21%, 77% 35%, 79% 57%, 99% 100%); }
                    }
              - type: custom:mushroom-template-card
                primary: Secure
                icon: mdi:cctv
                layout: vertical
                icon_color: green
                tap_action:
                  action: navigate
                  navigation_path: /dashboard-tablet/security
                layout_options:
                  grid_columns: 1
                  grid_rows: 2
              - type: custom:mushroom-template-card
                primary: Stats
                icon: mdi:chart-line
                tap_action:
                  action: navigate
                  navigation_path: stats
                layout_options:
                  grid_columns: 1
                  grid_rows: 2
                color: purple
                vertical: true
                features_position: bottom
              - type: custom:mushroom-template-card
                primary: House
                icon: mdi:home
                tap_action:
                  action: navigate
                  navigation_path: house
                layout_options:
                  grid_columns: 1
                  grid_rows: 2
                color: yellow
                vertical: true
                features_position: bottom
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-person-card
                entity: person.anita
                fill_container: true
                layout: horizontal
                icon_type: entity-picture
                visibility:
                  - condition: state
                    entity: person.anita
                    state: home
              - type: custom:mushroom-person-card
                entity: person.rients
                icon_type: entity-picture
                layout: horizontal
                visibility:
                  - condition: state
                    entity: person.rients
                    state: home
                fill_container: true
          - type: custom:mushroom-title-card
            title: Rooms
            title_tap_action:
              action: none
            subtitle_tap_action:
              action: none
          - type: custom:mushroom-template-card
            secondary: '{{ state_attr(''climate.woonkamer'',''current_temperature'') }}°C'
            icon: mdi:sofa
            entity: light.woonkamer_2
            tap_action:
              action: navigate
              navigation_path: livingroom
            icon_color: |-
              {% if is_state('light.beneden', 'on') %}
                amber
              {% endif %}
            double_tap_action:
              action: toggle
            primary: Woonkamer
          - type: custom:mushroom-template-card
            primary: Kitchen
            secondary: '{{ state_attr(''climate.gang'',''current_temperature'') }}°C'
            icon: mdi:chef-hat
            entity: light.kitchen_spots
            tap_action:
              action: navigate
              navigation_path: kitchen
            icon_color: |-
              {% if is_state('light.keuken', 'on') %}
                amber
              {% endif %}
            double_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Office
            secondary: '{{ states(''sensor.office_multi_sensor_temperature'') }}°C'
            icon: mdi:chair-rolling
            entity: light.office
            tap_action:
              action: navigate
              navigation_path: office
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.office', 'on') %}
                amber
              {% endif %}
          - type: custom:mushroom-template-card
            primary: Scullery
            secondary: '{{ states(''sensor.scullery_temperature'') }}°C'
            icon: mdi:washing-machine
            entity: light.scullery
            tap_action:
              action: navigate
              navigation_path: /dashboard-tablet/scullery
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.scullery', 'on') %}
                amber
              {% endif %}
          - type: custom:mushroom-template-card
            primary: Hall
            secondary: >-
              {{ state_attr('climate.hall_downstairs','current_temperature')
              }}°C
            icon: mdi:door
            entity: light.hall
            tap_action:
              action: navigate
              navigation_path: /dashboard-tablet/hall
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.hall', 'on') %}
                amber
              {% endif %}
          - type: custom:mushroom-template-card
            primary: Bedroom
            secondary: '{{ state_attr(''climate.bedroom'',''current_temperature'') }}°C'
            icon: mdi:bed-king
            entity: light.bedroom
            tap_action:
              action: navigate
              navigation_path: bedroom
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.bedroom', 'on') %}
                amber
              {% endif %}
          - type: custom:mushroom-template-card
            primary: Daan
            secondary: '{{ state_attr(''climate.daan'',''current_temperature'') }}°C'
            icon: mdi:human-male
            entity: light.daan
            tap_action:
              action: navigate
              navigation_path: /dashboard-tablet/daan
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.daan', 'on') %}
                amber
              {% endif %}
          - type: custom:mushroom-template-card
            primary: Floor
            secondary: '{{ state_attr(''climate.floor'',''current_temperature'') }}°C'
            icon: mdi:human-female
            entity: light.aqara_smart_wall_switch
            tap_action:
              action: navigate
              navigation_path: floor
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.aqara_smart_wall_switch', 'on') %}
                amber
              {% endif %}
          - type: custom:mushroom-template-card
            primary: Bathroom
            secondary: '{{ state_attr(''climate.bathroom'',''current_temperature'') }}°C'
            icon: mdi:shower
            entity: light.bathroom_spots
            tap_action:
              action: navigate
              navigation_path: bathroom
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.bathroom_spots', 'on') %}
                amber
              {% endif %}
          - type: custom:mushroom-template-card
            primary: Attic
            secondary: '{{ state_attr(''climate.attic'',''current_temperature'') }}°C'
            icon: mdi:home-roof
            entity: climate.attic
            tap_action:
              action: navigate
              navigation_path: attic
            double_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Wardrobe
            secondary: '{{ state_attr(''climate.wardrobe'',''current_temperature'') }}°C'
            icon: mdi:hanger
            entity: climate.wardrobe
            tap_action:
              action: navigate
              navigation_path: wardrobe
            double_tap_action:
              action: toggle
          - type: custom:mushroom-template-card
            primary: Toilet
            secondary: '{{ state_attr(''climate.toilet'',''current_temperature'') }}°C'
            icon: mdi:toilet
            entity: light.toilet
            tap_action:
              action: navigate
              navigation_path: toilet
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.toilet', 'on') %}
                amber
              {% endif %}
          - type: custom:mushroom-template-card
            primary: Garden
            secondary: '{{ states(''sensor.br_temperature'') }}°C'
            icon: mdi:flower
            entity: light.garden
            tap_action:
              action: navigate
              navigation_path: garden
            double_tap_action:
              action: toggle
            icon_color: |-
              {% if is_state('light.garden', 'on') %}
                amber
              {% endif %}
            layout_options:
              grid_columns: 4
              grid_rows: 1
      - type: grid
        cards:
          - clock_style: analog
            clock_size: small
            show_seconds: true
            no_background: false
            type: clock
            visibility:
              - condition: screen
                media_query: '(min-width: 768px)'
            face_style: markers
            border: false
            ticks: hour
            seconds_motion: continuous
          - type: markdown
            content: >-
              {% set Weekdays =
              ["Maandag","Dinsdag","Woensdag","Donderdag","Vrijdag","Zaterdag","Zondag"]
              %} 

               ## <center>{{Weekdays[now().weekday()] }} {{ now().strftime('%d/%m/%Y') }}
               </center>
            visibility:
              - condition: screen
                media_query: '(min-width: 768px)'
            grid_options:
              columns: 6
              rows: 2
          - entities:
              - entity: calendar.rients_marianto_nl
                accent_color: '#1e88e5'
                label: 👨‍⚕️
              - entity: calendar.regio_uh
                accent_color: '#43a047'
              - entity: calendar.regio_uh_bestuur
                accent_color: '#D170DE'
            compact_events_to_show: 8
            show_empty_days: true
            split_multiday_events: true
            title: 📅 Upcoming events
            vertical_line_width: 5px
            today_indicator: dot
            event_background_opacity: 15
            show_progress_bar: true
            show_single_allday_time: false
            weather:
              position: date
              date:
                show_conditions: true
                show_high_temp: true
                show_low_temp: false
                icon_size: 14px
                font_size: 12px
                color: var(--primary-text-color)
              event:
                show_conditions: true
                show_temp: true
                icon_size: 14px
                font_size: 12px
                color: var(--primary-text-color)
            tap_action:
              action: expand
            refresh_interval: 15
            refresh_on_navigate: false
            type: custom:calendar-card-pro
            row_spacing: 10px
            horizontal_line_color: '#343434'
            max_events_to_show: 8
            visibility:
              - condition: screen
                media_query: '(min-width: 768px)'
          - type: thermostat
            entity: climate.zolder
        column_span: 1
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            secondary: '{{ states(''sensor.netto_power'') }} Watt'
            icon: mdi:power-plug
            entity: sensor.netto_power
            tap_action:
              action: more-info
            primary: ''
            layout_options:
              grid_columns: 4
              grid_rows: 2
            color: |-
              {% if states('sensor.netto_power') | int < 300 %}
                green
              {% elif states('sensor.netto_power') | int < 1000 %}
                orange
              {% else %}
                red
              {% endif %}
            vertical: true
            features_position: bottom
            card_mod:
              style: |
                ha-card {
                  --secondary: 20px;
                }
          - type: custom:mushroom-template-card
            primary: Gas
            secondary: '{{ states(''sensor.zonneplan_p1_gas_consumption_today'') }} m³'
            icon: mdi:gas-burner
            entity: sensor.zonneplan_p1_gas_consumption_today
            icon_color: >-
              {% if states('sensor.zonneplan_p1_gas_consumption_today') | int <
              5 %}
                green
              {% elif states('sensor.zonneplan_p1_gas_consumption_today') | int
              < 10 %}
                orange
              {% else %}
                red
              {% endif %}
            layout: vertical
            tap_action:
              action: more-info
            fill_container: false
            card_mod:
              style: |
                ha-card {
                  --card-secondary-font-size: 20px;
                }
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: Electricity
            secondary: '{{ states(''sensor.zonneplan_netto_consumption_today'') }} kWh'
            icon: mdi:flash
            entity: sensor.zonneplan_netto_consumption_today
            icon_color: >-
              {% if states('sensor.zonneplan_netto_consumption_today') | int < 6
              %}
                green
              {% elif states('sensor.zonneplan_netto_consumption_today') | int <
              10 %}
                orange
              {% else %}
                red
              {% endif %}
            layout: vertical
            tap_action:
              action: more-info
            fill_container: false
            card_mod:
              style: |
                ha-card {
                  --card-secondary-font-size: 20px;
                }
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: Water
            secondary: >-
              {{ (states('sensor.daily_water') |float(0) * 1000) | round(0)}}
              liter
            icon: mdi:water
            entity: sensor.daily_water
            icon_color: |-
              {% if states('sensor.daily_water') | float < 0.2 %}
                green
              {% elif states('sensor.daily_water') | float < 0.3 %}
                orange
              {% else %}
                red
              {% endif %}
            layout: vertical
            tap_action:
              action: more-info
            fill_container: false
            card_mod:
              style: |
                ha-card {
                  --card-secondary-font-size: 20px;
                }
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: 'Lowest: € {{ states(''sensor.zonneplan_lowest_price'')|round(2) }}'
            secondary: at {{ states('sensor.zonneplan_cheapest_time') }}
            icon: mdi:currency-eur
            entity: sensor.lowest_price_electricity
            icon_color: blue
            layout: vertical
            tap_action:
              action: more-info
            fill_container: false
            card_mod:
              style: |
                ha-card {
                  --card-secondary-font-size: 20px;
                }
            grid_options:
              columns: 4
              rows: 2
          - type: gauge
            entity: sensor.solar_energy_expected
            name: Energy Score
            needle: true
            severity:
              green: 70
              yellow: 30
              red: 0
            grid_options:
              columns: 4
              rows: 2
          - type: custom:mushroom-template-card
            primary: >-
              Costs € {{
              '{:,.2f}'.format(states('sensor.total_energy_score_cost') | float)
              }}
            secondary: >-
              Pot. Savings € {{
              states('sensor.total_energy_score_potential_savings') }}
            icon: mdi:currency-eur
            entity: sensor.total_energy_score_cost
            icon_color: amber
            layout: vertical
            tap_action:
              action: more-info
            fill_container: false
            grid_options:
              columns: 4
              rows: 2
          - type: custom:apexcharts-card
            graph_span: 36h
            show:
              last_updated: true
            experimental:
              color_threshold: true
            header:
              title: Energy price today (€/kWh) - Zonneplan
              show: true
              show_states: true
              colorize_states: true
            span:
              start: day
            now:
              show: true
              label: Now
            series:
              - entity: sensor.l1_fase_1
                color: green
                type: column
                show:
                  extremas: true
                  in_header: raw
                color_threshold:
                  - value: 0
                    color: blue
                  - value: 0.2
                    color: lightgreen
                  - value: 0.25
                    color: green
                  - value: 0.3
                    color: greenyellow
                  - value: 0.35
                    color: yellow
                  - value: 0.4
                    color: orange
                  - value: 0.45
                    color: red
                float_precision: 2
                data_generator: |
                  return entity.attributes.times.map((time, index) => {
                    return [new Date(time).getTime(), entity.attributes.prices[index]];
                  });
            yaxis:
              - decimals: 2
                apex_config:
                  tickAmount: 5
        visibility:
          - condition: screen
            media_query: '(min-width: 768px)'
    badges:
      - type: custom:mushroom-template-badge
        content: ''
        icon: |2-
                {% if is_state('input_boolean.mail_arrived', 'on') %}
                  mdi:mailbox
                {% else %}
                  mdi:mailbox-open-up-outline
                {% endif %}
        color: |2-
                {% if is_state('input_boolean.mail_arrived', 'on') %}
                  yellow
                {% else %}
                  grey
                {% endif %}
        double_tap_action:
          action: perform-action
          perform_action: input_boolean.toggle
          target:
            entity_id: input_boolean.mail_arrived
        visibility:
          - condition: state
            entity: input_boolean.mail_arrived
            state: 'on'
        card_mod:
          style: |
            ha-state-icon {
              {{ 'animation: bounce 1s linear infinite;' if is_state('input_boolean.mail_arrived', 'on') }}
            }
            @keyframes bounce {
              0%, 10%, 50%, 80%, 100% {transform: translateY(0); } 
              40% { transform: translateY(-1.2px) rotate(5deg); } 
              60% { transform: translateY(-1.1px) rotate(-4deg); } 
            }
      - type: custom:mushroom-template-badge
        content: ''
        icon: |2-
                {% if is_state('input_boolean.package_arrived', 'on') %}
                  mdi:package-variant-closed-check
                {% else %}
                  mdi:package-variant-closed
                {% endif %}
        color: |2-
                {% if is_state('input_boolean.package_arrived', 'on') %}
                  yellow
                {% else %}
                  grey
                {% endif %}
        double_tap_action:
          action: perform-action
          perform_action: input_boolean.toggle
          target:
            entity_id: input_boolean.package_arrived
        visibility:
          - condition: state
            entity: input_boolean.package_arrived
            state: 'on'
        card_mod:
          style: |
            ha-state-icon {
              {{ 'animation: bounce 1s linear infinite;' if is_state('input_boolean.package_arrived', 'on') }}
            }
            @keyframes bounce {
              0%, 10%, 50%, 80%, 100% {transform: translateY(0); } 
              40% { transform: translateY(-1.2px) rotate(5deg); } 
              60% { transform: translateY(-1.1px) rotate(-4deg); } 
            }
      - type: custom:mushroom-template-badge
        content: '{{ states(''sensor.fire_tablet_battery'')}} %'
        icon: |2-
                {% set batterylevel = states('sensor.fire_tablet_battery') | round(0) |
                int // 10 * 10 %}

                {% if batterylevel == 100 %}
                  mdi:battery
                {% elif batterylevel == 0 %}
                  mdi:battery-low
                {% else %}
                  mdi:battery-{{batterylevel}}
                {% endif %}
        color: |2-
                {% set batterylevel = states('sensor.fire_tablet_battery') | round(0) |
                int // 10 * 10 %}

                {% if batterylevel >= 60 %}
                  light-green
                {% elif batterylevel >= 30 %}
                  orange
                {% else %}
                  red
                {% endif %}
        label: ''
        visibility:
          - condition: screen
            media_query: '(min-width: 768px)'
          - condition: state
            entity: binary_sensor.fire_tablet_plugged_in
            state: 'on'
      - type: custom:mushroom-template-badge
        content: ''
        icon: |-
          {% set pluggedin = states('binary_sensor.fire_tablet_plugged_in' ) %}
                {% if pluggedin == 'on' %}
                  mdi:power-plug
                {% else %}
                  mdi:power-plug-off
                {% endif %}
        color: |2-
                {% set pluggedin = states('binary_sensor.fire_tablet_plugged_in' ) %}
                {% if pluggedin == 'on' %}
                  light-green
                {% else %}
                  grey
                {% endif %}
        entity: switch.sw_plug_5
        double_tap_action:
          action: toggle
        visibility:
          - condition: screen
            media_query: '(min-width: 768px)'
          - condition: state
            entity: binary_sensor.fire_tablet_plugged_in
            state: 'on'
        card_mod:
          style: |
            ha-state-icon {
              {{ 'animation: pulse 3s linear infinite; transform-origin: 50% 60%;'}}       
              }
              @keyframes pulse {
                0% { transform: scale(1); }
                10% { transform: scale(1.1); }
                17% { transform: scale(1.05); }
                33% { transform: scale(1.25); }
                60% { transform: scale(1); }
              }
      - type: custom:mushroom-template-badge
        content: ''
        icon: |-
          {% if is_state('input_boolean.kiosk_mode','on') %}
                  mdi:arrow-expand-vertical
                {% else %}
                  mdi:arrow-collapse-up
                {% endif %}
        color: light-green
        tap_action:
          action: perform-action
          perform_action: input_boolean.toggle
          target:
            entity_id: input_boolean.kiosk_mode
    cards: []
    background:
      opacity: 33
      alignment: center
      size: cover
      repeat: repeat
      attachment: fixed
      image: /api/image/serve/23c29c874c04f7221b0b0e724303c47e/original
  - theme: Backend-selected
    title: Lights
    path: lights
    icon: ''
    type: sections
    layout:
      grid-template-columns: 30% auto 30%
      grid-template-rows: auto
      grid-template-areas: |
        "header header header"
        ". messages ."
        "left middle right"
        "footer footer footer"
      mediaquery:
        '(max-width: 400px)':
          grid-template-columns: 100%
          grid-template-areas: |
            "header"
            "messages"
