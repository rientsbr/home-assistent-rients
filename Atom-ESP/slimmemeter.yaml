---
substitutions:
  device_name: slimmelezer
    
esphome:
  name: ${device_name}
  name_add_mac_suffix: false
  on_boot:
    then:
      - if:
          condition:
            lambda: return id(has_key);
          then:
            - lambda: |-
                id(dsmr_instance).set_decryption_key(id(stored_decryption_key));
            - logger.log:
                level: info
                format: "Not using decryption key. If you need to set a key use Home Assistant service 'ESPHome:  ${device_name}_set_dsmr_key'"
  friendly_name: slimmemeter

esp8266:
  restore_from_flash: true
  board: d1_mini

wifi:
  # remove leading '#' and fill in your wifi details !!
#  ssid: !secret wifi_ssid 
#  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}
  
  # Powersaving for brownout due to 250mA restriction P1
  #output_power: 10dB

captive_portal:

# Enable logging
logger:
  baud_rate: 0
#  logs: 
#    component: ERROR

# Enable Home Assistant API
api:
  actions:
    service: set_dsmr_key
    variables:
      private_key: string
    then:
      - logger.log:
          format: Setting private key %s. Set to empty string to disable
          args: [private_key.c_str()]
      - globals.set:
          id: has_key
          value: !lambda "return private_key.length() == 32;"
      - lambda: |-
          if (private_key.length() == 32)
            private_key.copy(id(stored_decryption_key), 32);
          id(dsmr_instance).set_decryption_key(private_key.c_str());

ota:
  - platform: esphome
#  - platform: web_server

web_server:
  port: 80

  auth:
    username: rients
    password: !secret atom__web_password
    type: digest

uart:
  baud_rate: 115200
  rx_pin: D7
  rx_buffer_size: 4096

globals:
  - id: has_key
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: stored_decryption_key
    type: char[32]
    restore_value: yes

## RESET FUNCTION ##
switch:
  - platform: factory_reset
    name: Restart with Factory Default Settings
    id: resetbutton
    internal: true

binary_sensor:
  - platform: gpio
    name: "Reset switch GPIO5"
    pin: 
      number: GPIO5
      mode:
        input: true
        pullup: false
    on_press: 
      then:
        - logger.log: "Reset button pressed"
        - switch.turn_on: resetbutton

light:
  - platform: status_led
    name: "Status LED"
    pin: 
      number: GPIO02
      inverted: true
## END RESET FUNCTION ##

dsmr:
  id: dsmr_instance
  max_telegram_length: 4096
  # For Luxembourg users set here your decryption key
  #decryption_key: !secret decryption_key // enable this when using decryption for Luxembourg; key like '00112233445566778899AABBCCDDEEFF'

sensor:
  - platform: dsmr
    energy_delivered_tariff1:
      name: "Energy Consumed Tariff 1"
    energy_delivered_tariff2:
      name: "Energy Consumed Tariff 2"
    energy_returned_tariff1:
      name: "Energy Produced Tariff 1"
    energy_returned_tariff2:
      name: "Energy Produced Tariff 2"
    power_delivered:
      name: "Power Consumed"
      accuracy_decimals: 3
    power_returned:
      name: "Power Produced"
      accuracy_decimals: 3
    electricity_failures:
      name: "Electricity Failures"
      icon: mdi:alert
    electricity_long_failures:
      name: "Long Electricity Failures"
      icon: mdi:alert
    voltage_l1:
      name: "Voltage Phase 1"
    voltage_l2:
      name: "Voltage Phase 2"
    voltage_l3:
      name: "Voltage Phase 3"
    current_l1:
      name: "Current Phase 1"
      filters: 
        - lambda: |-
            if (x> 25.0) {
            return{};
            }
            return{x};
    current_l2:
      name: "Current Phase 2"
      filters: 
        - lambda: |-
            if (x> 25.0) {
            return{};
            }
            return{x};
    current_l3:
      name: "Current Phase 3"
      filters: 
        - lambda: |-
            if (x> 25.0) {
            return{};
            }
            return{x};
    power_delivered_l1:
      name: "Power Consumed Phase 1"
      accuracy_decimals: 3
      filters: 
        - lambda: |-
            if (x> 5.75) {
            return{};
            }
            return{x};
    power_delivered_l2:
      name: "Power Consumed Phase 2"
      accuracy_decimals: 3
      filters: 
        - lambda: |-
            if (x> 5.75) {
            return{};
            }
            return{x};
    power_delivered_l3:
      name: "Power Consumed Phase 3"
      accuracy_decimals: 3
      filters: 
        - lambda: |-
            if (x> 5.75) {
            return{};
            }
            return{x};
    power_returned_l1:
      name: "Power Produced Phase 1"
      accuracy_decimals: 3
    power_returned_l2:
      name: "Power Produced Phase 2"
      accuracy_decimals: 3
    power_returned_l3:
      name: "Power Produced Phase 3"
      accuracy_decimals: 3
    gas_delivered:
      name: "Gas Consumed"
  - platform: uptime
    name: "SlimmeLezer Uptime"
  - platform: wifi_signal
    name: "SlimmeLezer Wi-Fi Signal"
    update_interval: 60s

text_sensor:
  - platform: dsmr
    identification:
      name: "DSMR Identification"
    p1_version:
      name: "DSMR Version"
#    timestamp:
#      name: "Timestamp"
  - platform: wifi_info
    ip_address:
      name: "SlimmeLezer IP Address"
    ssid:
      name: "SlimmeLezer Wi-Fi SSID"
    bssid:
      name: "SlimmeLezer Wi-Fi BSSID"
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
