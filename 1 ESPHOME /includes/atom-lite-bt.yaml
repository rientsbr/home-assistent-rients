# Gemeenscahppelijke deel ATOM

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  #name_add_mac_suffix: true

# We gebruiken de M5 Atom ESP32 bord maar wel met de nieuwste framework.
esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

debug:
  update_interval: 5s

# Enable logging
logger:
  baud_rate: 0




packages:
  ha: !include ha-integration-config.yaml
  binary_sensor: !include binary-sensor-config.yaml
  bt_proxy: !include bt-proxy-config.yaml
  sensor-config: !include sensor-config.yaml


# Restart & Safe Mode Buttons
button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset



