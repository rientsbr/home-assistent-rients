# Dit is een configuratie voor de Mitsubishi CN105 airco module in ESPHome
#

external_components:
 - source: github://echavet/MitsubishiCN105ESPHome

uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: GPIO26
  rx_pin: GPIO32
  #debug:
    

climate:
  - platform: cn105
    name: Airco
    id: "atoms3_clim"
    uart_id: HP_UART
    compressor_frequency_sensor:
      name: Compressor frequency
    input_power_sensor:
      name: Input power
    #kwh_sensor:
    #  name: Energy usage
    #runtime_hours_sensor:
    #  name: Runtime hours

    #outside_air_temperature_sensor:
    #  name: ${name} Outside air temperature
    vertical_vane_select:
      name: Orientation Verticale 
    target_humidity_sensor:
      name: "Target Humidity"
    #horizontal_vane_select:
    #  name: Orientation de la Vane Horizontale
    #isee_sensor:
    #  name: ISEE Sensor
    auto_sub_mode_sensor:
      name: auto-submode sensor
    sub_mode_sensor:
      name: submode sensor
    stage_sensor:
      name: stage sensor
    error_code_sensor:
      name: error code
    remote_temperature_source:
      sensor_id: ha_cdeg_sejour_et_cuisine
    remote_temperature_timeout: 60min
    update_interval: 3500ms # shouldn't be less than 1 second
    debounce_delay: 100ms # delay to prevent bouncing
    connection_bootstrap_delay: 24s # delay to wait for the ESP32 to boot up and stabilize the WiFi connection
    hp_uptime_connection_sensor:
      name: ${device_name} HP Uptime Connection
      update_interval: 30s
    supports:
      mode: [COOL, HEAT, FAN_ONLY, DRY]
      fan_mode: [AUTO, QUIET, LOW, MEDIUM, HIGH]
      swing_mode: ["OFF", VERTICAL]
      dual_setpoint: false
    visual:
      min_temperature: 17
      max_temperature: 28
      temperature_step:
        target_temperature: 0.5
        current_temperature: 0.1
