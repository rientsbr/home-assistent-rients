binary_sensor: 
  - platform: status
    name: "Home Assistant API Connection"
    id: ha_api_status
    
  - platform: gpio
    name: Knop
    pin:
      number: GPIO39
      inverted: true
      mode: INPUT
    filters:
      - delayed_off: 10ms
    
    on_click:
      - min_length: 10ms
        max_length: 350ms
        then:          
          - logger.log: Button short click
        # - display_menu.show: test_graphical_display_menu
      - min_length: 350ms    
        max_length: 4000ms
        then:
          - logger.log: Button long click