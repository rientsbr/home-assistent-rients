#
# Maximaal geoptimaliseerde & stabiele Slimmemeter YAML (Zuidwijk SlimmeLezer+)
#
substitutions:
  device_name: slimmelezer
  max_power_total: "20.0" # Max totaal vermogen in kW
  max_power_phase: "8.0"  # Max vermogen per fase in kW
  max_current: "35.0"     # Max stroomsterkte per fase in Ampère

esphome:
  name: ${device_name}
  name_add_mac_suffix: false
  friendly_name: slimmemeter

esp8266:
  restore_from_flash: false # Bespaart RAM en voorkomt flash-slijtage/stutter
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Verlaagt piekstroom op de P1-poort drastisch (voorkomt brownout-restarts!)
  # Verhoog naar 16dB of 17dB als je wifi-signaal te zwak wordt
  output_power: 14dB 

  # Fallback hotspot als wifi wegvalt (zonder zware captive_portal)
  ap:
    ssid: ${device_name}

logger:
  baud_rate: 0
  level: ERROR # Alleen echte fouten loggen bespaart veel RAM en CPU

api:
  encryption:
    key: !secret slimmelezer__encryption_key
  reboot_timeout: 15min # Herstart pas na 15 min geen verbinding (standaard is dit sneller)

ota:
  - platform: esphome

uart:
  baud_rate: 115200
  rx_pin: D7
  rx_buffer_size: 1024 # 1KB is precies groot genoeg voor een NL DSMR5 telegram

## RESET FUNCTION ##
switch:
  - platform: factory_reset
    name: Restart with Factory Default Settings
    id: resetbutton
    internal: true

binary_sensor:
  - platform: gpio
    name: "Reset switch GPIO5"
    internal: true # Hoeft niet naar HA gestuurd te worden
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: false
    on_press:
      then:
        - switch.turn_on: resetbutton

light:
  - platform: status_led
    name: "Status LED"
    internal: true # Bespaart API-verkeer
    pin:
      number: GPIO02
      inverted: true
## END RESET FUNCTION ##

dsmr:
  id: dsmr_instance
  max_telegram_length: 1024

sensor:
  # --- TOTAALSTANDEN ENERGIE (kWh) ---
  - platform: dsmr
    energy_delivered_tariff1:
      name: "Energy Consumed Tariff 1"
      filters:
        - lambda: 'if (x <= 0.0) return {}; return x;'
        - or:
            - throttle: 1min
            - delta: 0.005 # Update per 5 Wh i.p.v. 1 Wh (scheelt 80% wifi-verkeer)

    energy_delivered_tariff2:
      name: "Energy Consumed Tariff 2"
      filters:
        - lambda: 'if (x <= 0.0) return {}; return x;'
        - or:
            - throttle: 1min
            - delta: 0.005

    energy_returned_tariff1:
      name: "Energy Produced Tariff 1"
      filters:
        - lambda: 'if (x < 0.0) return {}; return x;'
        - or:
            - throttle: 1min
            - delta: 0.005

    energy_returned_tariff2:
      name: "Energy Produced Tariff 2"
      filters:
        - lambda: 'if (x < 0.0) return {}; return x;'
        - or:
            - throttle: 1min
            - delta: 0.005

    # --- TOTAAL VERMOGEN (kW) ---
    power_delivered:
      name: "Power Consumed"
      accuracy_decimals: 3
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_power_total}
        - or:
            - throttle_average: 10s # Veel lichter voor RAM dan sliding_window
            - delta: 0.050          # Directe update bij sprong van >= 50 Watt

    power_returned:
      name: "Power Produced"
      accuracy_decimals: 3
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_power_total}
        - or:
            - throttle_average: 10s
            - delta: 0.050

    # --- STROOMSTERKTE PER FASE (A) ---
    current_l1:
      name: "Current Phase 1"
      accuracy_decimals: 1
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_current}
        - or:
            - throttle: 15s
            - delta: 1.0 # Vangt inschakelpieken (>= 1A) direct op

    current_l2:
      name: "Current Phase 2"
      accuracy_decimals: 1
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_current}
        - or:
            - throttle: 15s
            - delta: 1.0

    current_l3:
      name: "Current Phase 3"
      accuracy_decimals: 1
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_current}
        - or:
            - throttle: 15s
            - delta: 1.0

    # --- VERMOGEN PER FASE (kW) ---
    power_delivered_l1:
      name: "Power Consumed Phase 1"
      accuracy_decimals: 3
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_power_phase}
        - or:
            - throttle_average: 15s
            - delta: 0.030 # Directe update bij >= 30 Watt verandering

    power_delivered_l2:
      name: "Power Consumed Phase 2"
      accuracy_decimals: 3
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_power_phase}
        - or:
            - throttle_average: 15s
            - delta: 0.030

    power_delivered_l3:
      name: "Power Consumed Phase 3"
      accuracy_decimals: 3
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_power_phase}
        - or:
            - throttle_average: 15s
            - delta: 0.030

    power_returned_l1:
      name: "Power Produced Phase 1"
      accuracy_decimals: 3
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_power_phase}
        - or:
            - throttle_average: 30s
            - delta: 0.030

    power_returned_l2:
      name: "Power Produced Phase 2"
      accuracy_decimals: 3
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_power_phase}
        - or:
            - throttle_average: 30s
            - delta: 0.030

    power_returned_l3:
      name: "Power Produced Phase 3"
      accuracy_decimals: 3
      filters:
        - clamp:
            min_value: 0.0
            max_value: ${max_power_phase}
        - or:
            - throttle_average: 30s
            - delta: 0.030

    # --- GASVERBRUIK (m³) ---
    gas_delivered:
      name: "Gas Consumed"
      accuracy_decimals: 3
      filters:
        - lambda: 'if (x <= 0.0) return {}; return x;'
        - or:
            - throttle: 1h
            - delta: 0.001

  # --- DIAGNOSTIEK (Om te zien of hij stabiel blijft) ---
  - platform: uptime
    name: "SlimmeLezer Uptime"
    update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: "SlimmeLezer Reset Reason"
