#
# Dit is de configuratie voor de ATOM-LITE ESP32 Blueutooth Proxy
# 
#  Als eerste definieer variabelen om zo deze code te kunnen hergebruiken.
#
substitutions:

  device_name: "atom-zolder"
  friendly_name: Atom-Zolder

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "HIPXCLuLVPn6jpmNamCL6H8pQmLY/vHGMDcKt8omu9s="

ota:
  - platform: esphome
    password: "77f001ddb52572068bb5d4398948d647"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name}
    password: "f5NQHwl4U8e1"

web_server:
  port: 80

captive_portal:


# Restart & Safe Mode Buttons
button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset

bluetooth_proxy:
  active: true          # default: true (Enables proxying active GATT connections to BLE device)
  cache_services: true  # default: true (Enables caching GATT services in NVS flash storage)
  connection_slots: 3   # default: 3 (The maximum number of BLE connection slots to use)

esp32_ble_tracker:
  scan_parameters:
    active: true        # default: true (Sends scan requests to get additional device data)
    interval: 320ms     # default: 320 (ms) – Time between scan windows
    window: 30ms        # default: 30 (ms) – Time actively listening during each interval (must be ≤ interval)
    duration: 5min      # default: 5min – Length of a scan cycle (ignored if continuous: true)
    continuous: true    # default: true – Scan continuously instead of in timed cycles

# Gebruik de GPIO39 pin als een knop met eenn debounce van 50ms.
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39    # Dit is Drukknop bovenop de ATOM-Lite
      mode: INPUT
      inverted: true    # Invert de logica van de knop
    name: "Atom Knop"
    id: atom_button
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_multi_click: # Detecteer meerdere klikken en lange klikken
      - timing:
          - ON for at most 0.8s
          - OFF for at most 0.5s
          - ON for at most 0.8s
          - OFF for at least 0.2s
        then:
          - logger.log: "Double Clicked"
          - light.turn_on:
              id: atom_light
              red: 100%
              blue: 50%
              green: 20%
              brightness: 50%
      - timing:
          - ON for at least 0.8s
        then:
          - logger.log: "Single Long Clicked"
          - light.turn_off:
              id: atom_light

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    pin: GPIO27       # Dit is de pin voor de RGB LED
    num_leds: 1
    chipset: SK6812   # Dit is het type LED dat in de ATOM-Lite zit (SK6812 RGBW) maar we gebruiken alleen RGB, dus W wordt genegeerd
    name: "Atom RGB Licht"
    id: atom_light
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - random:
          name: "Willekeurig"
          transition_length: 1s
          update_interval: 1s

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
