          {% set vorige = states('sensor.vermogen_fase_2_gefilterd') | float(none) %}
          {% if consumption is not none and 0 <= consumption <= 5.75 %}
            {{ (consumption) *1000 | round(2) }}
          {%else%}
            {{ vorige }}
          {%endif%}

  - sensor:
      #
      - name: "L1 Fase 3"
        unique_id: "l1_meter_fase3"
