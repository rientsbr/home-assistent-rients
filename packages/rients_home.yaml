# Templates etc voor RM Brandsma HA Dashboard
#
#
# TEMPLATES
# 
template:
#
# Vermogen per fase (uit P1 meter) omzettenn in Watt
#
  - sensor:
      # 
      - name: "L1 Fase 1"
        unique_id: "l1_meter_fase1"
        unit_of_measurement: "W"
        device_class: "power"
        state_class: "measurement"
        state: >
          {% set consumption = states('sensor.power_consumed_phase_1') | float(none) %}
          {% set vorige = states('sensor.vermogen_fase_1_gefilterd') | float(none) %}
          {% if consumption is not none and 0 <= consumption <= 5.75 %}
            {{ (consumption) *1000 | round(2) }}
          {%else%}
            {{ vorige }}
          {%endif%}

            


  - sensor:
      # 
      - name: "L1 Fase 2"
        unique_id: "l1_meter_fase2"
        unit_of_measurement: "W"
        device_class: "power"
        state_class: "measurement"
        state: >
