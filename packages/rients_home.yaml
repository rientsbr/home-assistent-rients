sensor:
  - platform: filter
    name: "Vermogen Fase_1 (Gefilterd)"
    entity_id: sensor.l1_fase_1
    filters:
      - filter: outlier
        window_size: 4
        radius: 3000

  - platform: filter
    name: "Vermogen Fase_2 (Gefilterd)"
    entity_id: sensor.l1_fase_2
    filters:
      - filter: outlier
        window_size: 4
        radius: 3000

  - platform: filter
    name: "Vermogen Fase_3 (Gefilterd)"
