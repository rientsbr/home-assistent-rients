            {{ vorige }}
          {%endif%}

#
#  template voor EVOHome thermostaar
  - sensor:
      #
      - name: "Thermostaat Woonkamer"
        unique_id: "thermostaat_woonkamer"
        unit_of_measurement: "°C"
        device_class: "temperature"
        state_class: "measurement"
        state: >
          {% set current_temp = state_attr('climate.woonkamer', 'current_temperature') | float(2) %}
          {% set set_temp = state_attr('climate.woonkamer', 'temperature') | float(2) %}
          {{ (set_temp - current_temp) * 10 | round(2) }}

  - sensor:
      #
      - name: "Thermostaat Zolder"
        unique_id: "thermostaat_zolder"
        unit_of_measurement: "°C"
        device_class: "temperature"
        state_class: "measurement"
        state: >
          {% set current_temp = state_attr('climate.zolder', 'current_temperature') | float(2) %}
          {% set set_temp = state_attr('climate.zolder', 'temperature') | float(2) %}
          {{ (set_temp - current_temp) * 10 | round(2) }}




input_number:
# Maximale vermogens voor de fases bij houden
  l1fase1max:
    # 
    name: "L1 Maximale Watage"
    min: 1
    max: 6000
    step: 1
    unit_of_measurement: "W"
    mode: box
    icon: mdi:chart-timeline-variant-shimmer
    
  l1fase2max:
    # 
    name: "L2 Maximale Watage"
    min: 1
    max: 6000
    step: 1
    unit_of_measurement: "W"
    mode: box
